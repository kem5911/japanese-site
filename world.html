<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>한일역 월드 · 日韓駅ワールド</title>
<meta name="theme-color" content="#14213d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+KR:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap">
<style>
  :root { --bg:#e7e9ec; --card:#fff; --text:#1a1f2b; --muted:#5a6170; --line:#cdd2d9;
    --navy:#14213d; --ko:#1e78d2; --ja:#c8102e; --ok:#2fa84f; --next:#ff9a1f; --tenji:#f2c200; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1116; --card:#1a1f27; --text:#eef1f6; --muted:#a3abba; --line:#2f3642; --navy:#0b1428; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--navy); color:var(--text);
    font-family:"Zen Kaku Gothic New","Noto Sans KR","Noto Sans JP",system-ui,sans-serif; }
  button, input { font:inherit; color:inherit; }
  #cv { position:fixed; inset:0; width:100%; height:100%; touch-action:none; display:block; }

  /* 위쪽: 역 이름판 + 버튼 */
  .top { position:fixed; left:0; right:0; top:0; padding:max(10px, env(safe-area-inset-top)) 12px 0; display:flex; gap:8px; align-items:flex-start; pointer-events:none; }
  .plate { pointer-events:auto; background:#fff; color:#1a1f2b; border-radius:6px; padding:6px 12px 0; min-width:150px; box-shadow:0 2px 0 rgba(0,0,0,.25); overflow:hidden; }
  .plate b { display:block; font-size:1.05rem; font-weight:900; line-height:1.2; }
  .plate small { display:block; font-size:.72rem; color:#5a6170; }
  .plate i { display:block; height:6px; margin:5px -12px 0; background:var(--pl, #00a3a8); }
  .sp { flex:1; }
  .tbtn { pointer-events:auto; min-height:44px; min-width:44px; padding:6px 12px; border:0; border-radius:8px; background:rgba(255,255,255,.92); color:#1a1f2b; font-weight:900; cursor:pointer; box-shadow:0 2px 0 rgba(0,0,0,.25); text-decoration:none; display:inline-flex; align-items:center; gap:4px; font-size:.9rem; }

  /* 역명판 찾기 진행 표시 */
  #hunt { position:fixed; left:50%; transform:translateX(-50%); top:calc(max(10px, env(safe-area-inset-top)) + 118px); background:#0f1a33; color:#fff; border-radius:10px; padding:8px 12px; display:flex; gap:10px; align-items:center; font-weight:900; box-shadow:0 3px 0 rgba(0,0,0,.3); white-space:nowrap; max-width:calc(100% - 24px); }
  #hunt .tg { color:#ff9a1f; font-size:1.15rem; overflow:hidden; text-overflow:ellipsis; }
  #hunt .led { font-family:ui-monospace,monospace; color:#4be08a; }
  #hunt button { border:0; background:rgba(255,255,255,.15); color:#fff; border-radius:6px; padding:4px 8px; cursor:pointer; min-height:32px; }
  [hidden] { display:none !important; }

  /* 조이스틱 + A 버튼 */
  #stick { position:fixed; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.4); pointer-events:none; }
  #stick i { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%; background:rgba(255,255,255,.85); box-shadow:0 2px 6px rgba(0,0,0,.3); }
  #stick.idle { opacity:.55; }
  #act { position:fixed; right:max(18px, env(safe-area-inset-right)); bottom:calc(28px + env(safe-area-inset-bottom)); width:84px; height:84px; border-radius:50%; border:4px solid #fff; background:var(--next); color:#1a1f2b; font-weight:900; font-size:1.6rem; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; }
  #act:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.35); }
  #actL { position:fixed; right:max(12px, env(safe-area-inset-right)); bottom:calc(120px + env(safe-area-inset-bottom)); background:#0f1a33; color:#fff; font-weight:900; padding:6px 10px; border-radius:8px; font-size:.9rem; max-width:60vw; text-align:center; }
  #hint { position:fixed; left:50%; top:calc(max(10px, env(safe-area-inset-top)) + 172px); transform:translateX(-50%); background:rgba(15,26,51,.92); color:#fff; padding:8px 14px; border-radius:20px; font-weight:700; font-size:.9rem; white-space:nowrap; transition:opacity .3s; pointer-events:none; }

  /* 창 (끝말잇기·결과·처음 안내) */
  .ov { position:fixed; inset:0; background:rgba(5,10,25,.55); display:flex; align-items:flex-end; justify-content:center; }
  .panel { width:100%; max-width:560px; max-height:100%; background:var(--bg); color:var(--text); border-radius:16px 16px 0 0; padding:14px 16px calc(16px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px; overflow:auto; }
  @media (min-width:700px) { .ov { align-items:center; } .panel { border-radius:16px; max-height:92vh; } }
  .ph { display:flex; align-items:center; gap:8px; }
  .ph h2 { margin:0; font-size:1.1rem; flex:1; }
  .ph .x { min-width:44px; min-height:44px; border:0; border-radius:8px; background:var(--card); cursor:pointer; font-weight:900; }
  .stat { display:flex; gap:12px; color:var(--muted); font-weight:700; font-size:.9rem; }
  .chain { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; height:min(30vh,220px); overflow:auto; display:flex; flex-direction:column; gap:6px; }
  .bub { max-width:80%; padding:6px 10px; border-radius:12px; line-height:1.3; }
  .bub b { font-size:1.1rem; } .bub small { display:block; color:var(--muted); font-size:.78rem; }
  .bub.cpu { align-self:flex-start; background:var(--bg); }
  .bub.me { align-self:flex-end; background:#dff3e4; }
  .bub.sys { align-self:center; background:none; color:var(--muted); font-size:.85rem; text-align:center; }
  @media (prefers-color-scheme: dark) { .bub.me { background:#16301f; } }
  .need { text-align:center; font-weight:900; font-size:1.05rem; }
  .need span { display:inline-block; min-width:1.8em; padding:2px 8px; margin:0 2px; background:var(--navy); color:#fff; border-radius:8px; font-size:1.5rem; }
  .bar { height:8px; border-radius:4px; background:var(--line); overflow:hidden; }
  .bar i { display:block; height:100%; width:100%; background:var(--ok); transform-origin:left; }
  .choices { display:grid; gap:8px; }
  .choices button { text-align:left; padding:10px 14px; min-height:56px; border:2px solid var(--line); background:var(--card); border-radius:12px; cursor:pointer; line-height:1.25; }
  .choices button b { font-size:1.25rem; margin-right:6px; }
  .choices button small { color:var(--muted); }
  .choices button.ok { border-color:var(--ok); background:#dff3e4; }
  .choices button.ng { border-color:var(--ja); background:#fbe3e6; }
  @media (prefers-color-scheme: dark) { .choices button.ok { background:#16301f; } .choices button.ng { background:#3a1a20; } }
  .typ { display:flex; gap:6px; }
  .typ input { flex:1; min-width:0; padding:10px 12px; border:2px solid var(--line); border-radius:10px; background:var(--card); font-size:1rem; }
  .typ button, .btns button { padding:10px 16px; min-height:44px; border:0; border-radius:10px; background:var(--navy); color:#fff; font-weight:900; cursor:pointer; }
  .btns { display:flex; gap:8px; } .btns button { flex:1; }
  .btns button.sub { background:var(--card); color:var(--text); border:2px solid var(--line); }
  .ex { color:var(--muted); font-size:.88rem; margin:0; line-height:1.5; }
  .big { font-size:2.2rem; font-weight:900; text-align:center; margin:4px 0; }
  .keys { display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:.92rem; align-items:center; }
  .keys span:nth-child(odd) { font-size:1.4rem; text-align:center; }
</style>
</head>
<body>
<canvas id="cv" aria-label="한일역 월드 · 日韓駅ワールド"></canvas>

<div class="top">
  <div class="plate" id="plate"><b id="plA">한일역</b><small id="plB">日韓駅 · HAN-IL</small><i></i></div>
  <div class="sp"></div>
  <button class="tbtn" id="langB" aria-label="언어 · 言語">🌐</button>
  <a class="tbtn" href="index.html" id="backB">← 앱</a>
</div>

<div id="hunt" hidden><span>🎯</span><span class="tg" id="huTg"></span><span class="led" id="huT">60</span><span>⭐<span id="huS">0</span></span><button id="huX">✕</button></div>

<div id="stick" class="idle" hidden><i></i></div>
<div id="actL" hidden></div>
<button id="act" hidden aria-label="A">A</button>
<div id="hint" style="opacity:0"></div>

<!-- 끝말잇기 / しりとり -->
<div class="ov" id="wc" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="wcT">
    <div class="ph"><h2 id="wcT"></h2><button class="x" id="wcX" aria-label="닫기">✕</button></div>
    <div class="stat"><span id="wcL"></span><span id="wcS"></span><span id="wcB"></span></div>
    <div class="chain" id="wcC" aria-live="polite"></div>
    <div class="need" id="wcN"></div>
    <div class="bar"><i id="wcBar"></i></div>
    <div class="choices" id="wcO"></div>
    <form class="typ" id="wcF"><input id="wcI" autocomplete="off" enterkeyhint="send"><button id="wcSend"></button></form>
    <p class="ex" id="wcR"></p>
  </div>
</div>

<!-- 결과 / 안내 -->
<div class="ov" id="msg" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="msgT">
    <div class="ph"><h2 id="msgT"></h2></div>
    <div id="msgB"></div>
    <div class="btns" id="msgK"></div>
  </div>
</div>

<script>
"use strict";
// ───────── 언어 (앱 본편과 같은 저장값 "kj-lang" 사용) ─────────
const LANG = (() => { try { const v = localStorage.getItem("kj-lang"); if (v === "ko" || v === "ja") return v; } catch {} return /^ja/i.test(navigator.language) ? "ja" : "ko"; })();
const JA = LANG === "ja", tr = (ko, ja) => JA ? ja : ko;
document.documentElement.lang = LANG;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// 한글 → 가타카나 읽기 (index.html 과 같은 규칙)
const kata = (() => {
  const ROW = {0:"カキクケコ",1:"カキクケコ",2:"ナニヌネノ",3:"タ,ティ,トゥ,テ,ト",4:"タ,ティ,トゥ,テ,ト",5:"ラリルレロ",6:"マミムメモ",7:"パピプペポ",8:"パピプペポ",9:"サシスセソ",10:"サシスセソ",11:"アイウエオ",12:"チャ,チ,チュ,チェ,チョ",13:"チャ,チ,チュ,チェ,チョ",14:"チャ,チ,チュ,チェ,チョ",15:"カキクケコ",16:"タ,ティ,トゥ,テ,ト",17:"パピプペポ",18:"ハヒフヘホ"};
  const VOICED = {0:"ガギグゲゴ",3:"ダ,ディ,ドゥ,デ,ド",7:"バビブベボ",12:"ジャ,ジ,ジュ,ジェ,ジョ"};
  const cols = s => s.includes(",") ? s.split(",") : [...s];
  const VW = [[0],[3],[0,"y"],[3,"y"],[4],[3],[4,"y"],[3,"y"],[4],[0,"w"],[3,"w"],[3,"w"],[4,"y"],[2],[4,"w"],[3,"w"],[1,"w"],[2,"y"],[2],[1,"w"],[1]];
  const SMALL = { y:["ャ","","ュ","ェ","ョ"], w:["ァ","ィ","","ェ","ォ"] };
  const FIN = {1:"ク",2:"ク",4:"ン",7:"ッ",8:"ル",16:"ム",17:"プ",19:"ッ",20:"ッ",21:"ン",22:"ッ",23:"ッ",24:"ク",25:"ッ",26:"プ",27:"ッ"};
  return word => {
    let out = "", prevFin = -1;
    for (const ch of word) {
      const n = ch.charCodeAt(0) - 44032;
      if (n < 0 || n > 11171) { out += /\s/.test(ch) ? " " : /[?？]/.test(ch) ? "？" : /[.,。、!！]/.test(ch) ? ch : ""; prevFin = -1; continue; }
      const a = Math.floor(n / 588), b = Math.floor(n % 588 / 28), c = n % 28, [col, semi] = VW[b];
      const soft = prevFin === 0 || [4, 8, 16, 21].includes(prevFin);
      const row = cols((soft && VOICED[a]) || ROW[a]);
      let s;
      if (!semi) s = row[col];
      else if (a === 11) s = semi === "y" ? {0:"ヤ",2:"ユ",3:"イェ",4:"ヨ"}[col] : {0:"ワ",1:"ウィ",3:"ウェ",4:"ウォ"}[col];
      else if (semi === "y") s = row[1] + SMALL.y[col];
      else s = row[2].replace(/ゥ$/, "") + SMALL.w[col];
      out += s + (FIN[c] || ""); prevFin = c;
    }
    return out.trim();
  };
})();

// 기록 탭(jp-rec)에 게임 점수 남기기 — index.html 의 Rec.game 과 같은 모양
function recGame(id, score, name) {
  try {
    const r = JSON.parse(localStorage.getItem("jp-rec")) || {};
    r.games = r.games || {}; r.days = r.days || [];
    const g = r.games[id] || (r.games[id] = { best: null, plays: 0 });
    g.ko = name.ko; g.ja = name.ja;
    const best = g.best === null || score > g.best;
    if (best) g.best = score;
    g.plays++; g.at = Date.now();
    const d = new Date(), ymd = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    if (!r.days.includes(ymd)) r.days.push(ymd);
    localStorage.setItem("jp-rec", JSON.stringify(r));
    return { best, prev: best ? null : g.best };
  } catch { return { best: false }; }
}
const bestOf = id => { try { return (JSON.parse(localStorage.getItem("jp-rec")) || {}).games?.[id]?.best ?? null; } catch { return null; } };

}

for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {

  else if (y === 8) v = 1;
  else if (y === 12) v = 1;

}

const HB = 0.28;
function blocked(x, y) { return solid(x - HB, y - HB) || solid(x + HB, y - HB) || solid(x - HB, y + HB) || solid(x + HB, y + HB); }
function moveBody(b, vx, vy, dt) {
  const nx = b.x + vx * dt, ny = b.y + vy * dt;
  let moved = false;
  if (!blocked(nx, b.y)) { b.x = nx; moved = true; }
  if (!blocked(b.x, ny)) { b.y = ny; moved = true; }
  return moved;
}

const HUNT_SEC = 60;

function huntRound() {

}
function startHunt() {

  $("hunt").hidden = false; $("huS").textContent = 0;
  me.x = 15.5; me.y = 17.2;

  hint(JA ? "その意味の韓国語が書いてある看板へ走ろう！" : "그 뜻의 일본어가 적힌 역명판으로 달려가요!", 2800);

        setTimeout(() => { if (hunt.on) huntRound(); }, 350);

function meTurn() {
  WC.turn = "me"; WC.busy = false;
  const l = WC.lang, need = needOf(l, WC.last), D = dictOf(l);
  $("wcN").innerHTML = tr(`${needLabel()} (으)로 시작하는 말`, `${needLabel()} から始まる言葉`);
  const ok = D.filter(e => !WC.used.has(e[0]) && fits(l, need, e[0]) && !endsN(l, e[0]));
  const trap = D.filter(e => !WC.used.has(e[0]) && fits(l, need, e[0]) && endsN(l, e[0]));
  const wrong = shuffle(D.filter(e => !WC.used.has(e[0]) && !fits(l, need, e[0])));
  const right = pick(ok);
  const opts = [right];
  if (trap.length && Math.random() < 0.7) opts.push(pick(trap));
  while (opts.length < 3 && wrong.length) opts.push(wrong.pop());
  shuffle(opts);
  $("wcO").innerHTML = "";
  for (const e of opts) {
    const v = view(l, e), b = document.createElement("button");
    b.innerHTML = `<b>${esc(v.main)}</b>${v.sub ? `<small>${esc(v.sub)}</small> ` : ""}<br><small>${esc(v.mean)}</small>`;
    b.onclick = () => answer(e, b, right);
    $("wcO").append(b);
  }
  WC.timer = WC.T; WC.tick = performance.now();
  $("wcI").value = "";
}
function answer(e, btn, right) {
  if (WC.turn !== "me" || WC.busy) return;
  WC.busy = true;
  const l = WC.lang, need = needOf(l, WC.last);
  const bad = !e || !fits(l, need, e[0]) || WC.used.has(e[0]);
  const btns = [...$("wcO").children];
  if (!bad && endsN(l, e[0])) {
    btn && btn.classList.add("ng");
    addBub("me", l, e, tr("'ん'으로 끝나서 아웃!", "「ん」で終わったのでアウト！"));
    WC.used.add(e[0]); return miss(right);
  }
  if (bad) {
    btn && btn.classList.add("ng");
    if (e) addBub("sys", l, null, tr(`❌ '${e[0]}' 는 ${need.join("/")} (으)로 시작하지 않아요`, `❌「${e[0]}」は ${need.join("/")} から始まらないよ`));
    return miss(right);
  }
  btn && btn.classList.add("ok");
  WC.used.add(e[0]); WC.last = e[0]; WC.score++;
  addBub("me", l, e); wcStat();
  setTimeout(() => { if (!$("wc").hidden) cpuTurn(false); }, 450);
}
function miss(right) {
  WC.lives--; wcStat();
  [...$("wcO").children].forEach(b => { if (b.querySelector("b").textContent === view(WC.lang, right).main) b.classList.add("ok"); });
  if (WC.lives <= 0) { WC.turn = "end"; setTimeout(endChain, 900); return; }
  addBub("sys", WC.lang, null, tr(`정답 예: ${right[0]} · 이어서 갈게요`, `正解の例：${right[0]}・続けるよ`));
  setTimeout(() => { if ($("wc").hidden) return; WC.used.add(right[0]); WC.last = right[0]; addBub("me", WC.lang, right, tr("대신 이었어요", "代わりにつないだよ")); cpuTurn(false); }, 900);
}
$("wcF").onsubmit = ev => {
  ev.preventDefault();
  if (WC.turn !== "me" || WC.busy) return;
  let v = $("wcI").value.trim().replace(/\s/g, ""); if (!v) return;
  if (WC.lang === "ja") v = toHira(v);
  const e = dictOf(WC.lang).find(x => x[0] === v);
  const need = needOf(WC.lang, WC.last);
  if (!fits(WC.lang, need, v)) { hintIn(tr(`${need.join("/")} (으)로 시작해야 해요`, `${need.join("/")} から始めてね`)); return; }
  if (WC.used.has(v)) { hintIn(tr("이미 나온 말이에요", "もう出た言葉だよ")); return; }
  if (!e) { hintIn(tr("아직 사전에 없는 말이에요. 다른 말로!", "まだ辞書にない言葉。ほかの言葉で！")); return; }
  const right = dictOf(WC.lang).find(x => !WC.used.has(x[0]) && fits(WC.lang, need, x[0]) && !endsN(WC.lang, x[0])) || e;
  answer(e, null, right);
};
function hintIn(s) { $("wcR").dataset.keep = $("wcR").dataset.keep || $("wcR").textContent; $("wcR").textContent = "⚠️ " + s; setTimeout(() => { if ($("wcR").dataset.keep) { $("wcR").textContent = $("wcR").dataset.keep; delete $("wcR").dataset.keep; } }, 2200); }
function wcTick() {
  if ($("wc").hidden || WC.turn !== "me" || WC.busy) return;
  const now = performance.now(); WC.timer -= (now - WC.tick) / 1000; WC.tick = now;
  $("wcBar").style.transform = `scaleX(${Math.max(0, WC.timer / WC.T)})`;
  $("wcBar").style.background = WC.timer < 4 ? "#c8102e" : "";
  if (WC.timer <= 0) {
    WC.busy = true;
    const need = needOf(WC.lang, WC.last);
    const right = dictOf(WC.lang).find(x => !WC.used.has(x[0]) && fits(WC.lang, need, x[0]) && !endsN(WC.lang, x[0]));
    addBub("sys", WC.lang, null, tr("⏰ 시간 초과!", "⏰ 時間切れ！"));
    miss(right);
  }
}
function endChain() {
  const id = "world-" + WC.lang;
  const SC = WC.score, r = recGame(id, WC.score, WC.lang === "ko" ? { ko: "끝말잇기 (한국어)", ja: "韓国語しりとり" } : { ko: "しりとり (일본어)", ja: "しりとり（日本語）" });
  $("wc").hidden = true;
  showMsg(WC.lang === "ko" ? tr("🇰🇷 끝말잇기 끝!", "🇰🇷 韓国語しりとり終了！") : tr("🇯🇵 しりとり 끝!", "🇯🇵 しりとり終了！"),
    `<div class="big">🔗 ${WC.score}</div><p class="ex" style="text-align:center">${r.best && SC > 0 ? tr("🎉 최고 기록!", "🎉 自己ベスト！") : tr(`최고 기록 ${r.best ? SC : r.prev}`, `自己ベスト ${r.best ? SC : r.prev}`)}${WC.wins ? tr(` · CPU를 ${WC.wins}번 이겼어요`, ` · CPUに${WC.wins}回勝った`) : ""}</p>`,
    [[tr("한 번 더", "もう一回"), () => { const l = WC.lang; closeAll(); openChain(l); }], [tr("돌아다니기", "歩きまわる"), closeAll, true]]);
}
$("wcX").onclick = () => { WC.tid++; WC.turn = "end"; $("wc").hidden = true; if (WC.score > 0) endChain(); else closeAll(); };

function showMsg(title, html, btns) {
  modal = true; keys.clear();
  $("msgT").textContent = title; $("msgB").innerHTML = html; $("msgK").innerHTML = "";
  for (const [t, fn, sub] of btns) { const b = document.createElement("button"); b.textContent = t; if (sub) b.className = "sub"; b.onclick = fn; $("msgK").append(b); }
  $("msg").hidden = false;
  setTimeout(() => $("msgK").firstChild && $("msgK").firstChild.focus(), 50);
}
function closeAll() { WC.tid++; $("wc").hidden = true; $("msg").hidden = true; modal = false; }

// ───────── 위 버튼 ─────────
$("backB").textContent = tr("← 앱", "← アプリ");
$("langB").textContent = JA ? "🌐 한국어" : "🌐 日本語";
$("langB").onclick = () => { try { localStorage.setItem("kj-lang", JA ? "ko" : "ja"); localStorage.setItem("jp-rec-lang", JA ? "ko" : "ja"); } catch {} location.reload(); };

// ───────── 메인 루프 ─────────
let prev = performance.now(), T0 = prev;
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now; const t = (now - T0) / 1000;
  // 내 캐릭터
  let vx = 0, vy = 0;
  if (!modal) {
    if (keys.has("arrowleft") || keys.has("a")) vx -= 1;
    if (keys.has("arrowright") || keys.has("d")) vx += 1;
    if (keys.has("arrowup") || keys.has("w")) vy -= 1;
    if (keys.has("arrowdown") || keys.has("s")) vy += 1;
    if (stick.on) { vx += stick.vx; vy += stick.vy; }
  }
  const m = Math.hypot(vx, vy);
  if (m > 1) { vx /= m; vy /= m; }
  me.moving = m > 0.15;
  if (me.moving) { const SP = 4.6; moveBody(me, vx * SP, vy * SP, dt); me.walk += dt; me.dx = vx; me.dy = vy; }
  // 승객들
  for (const n of NPCS) {
    n.wait -= dt;
    const dx = n.tx - n.x, dy = n.ty - n.y, d = Math.hypot(dx, dy);
    if (n.wait > 0 || d < 0.1) { n.moving = false; if (n.wait <= 0) { n.wait = 1.5 + Math.random() * 3; n.tx = n.home[0] + (Math.random() - 0.5) * 6; n.ty = n.home[1] + (Math.random() - 0.5) * 3; } continue; }
    const s = 1.3, ok = moveBody(n, dx / d * s, dy / d * s, dt);
    n.moving = ok; n.walk += dt; n.dx = dx / d; n.dy = dy / d;
    if (!ok) n.wait = 0.5;
  }
  // 전철
  train.t -= dt;
  if (train.t <= 0) { train.t = 14 + Math.random() * 8; train.dir = Math.random() < 0.5 ? 1 : -1; train.x = train.dir > 0 ? -16 : MW + 16; train.run = true; }
  if (train.run) { train.x += train.dir * 11 * dt; if (train.x < -18 || train.x > MW + 18) train.run = false; }
  if (hunt.on && !modal) huntTick(dt);
  if (typeof NET !== "undefined") NET.tick(dt);
  wcTick();

  // 구역 안내
  const z = modal ? null : nearZone();
  if (z !== near) {
    near = z;
    $("actL").hidden = !z; if (z) $("actL").textContent = (touchUI ? "A · " : tr("스페이스 · ", "スペース・")) + z.a;
    $("act").style.background = z ? "" : "#b9c0cb";
  }
  updatePlate();

  // 카메라
  const vw = VW / PPT, vh = VH / PPT;
  camX = vw >= MW ? MW / 2 : Math.max(vw / 2, Math.min(MW - vw / 2, me.x));
  camY = vh >= MH ? MH / 2 : Math.max(vh / 2 - 1.6, Math.min(MH - vh / 2 + 1.2, me.y));
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#14213d"; ctx.fillRect(0, 0, VW, VH);
  ctx.setTransform(DPR * PPT, 0, 0, DPR * PPT, DPR * (VW / 2 - camX * PPT), DPR * (VH / 2 - camY * PPT));
  drawTiles(t);
  drawTrain(t);
  drawZoneBoards();
  // 깊이 순서대로
  const list = [...OBJ.map(o => ({ y: o.y + o.h, f: () => drawObj(o) })), ...SIGNS.map(s => ({ y: s.y + 0.2, f: () => drawSign(s, t) })),
    ...NPCS.map(n => ({ y: n.y, f: () => drawPerson(n) })), { y: me.y, f: () => drawPerson(me, typeof NET !== "undefined" && NET.state === "on" ? NET.myLabel() : tr("나", "わたし")) },
    ...(typeof NET !== "undefined" ? NET.drawList() : [])];
  list.sort((a, b) => a.y - b.y).forEach(o => o.f());
  for (const n of NPCS) if (Math.hypot(n.x - me.x, n.y - me.y) < 2.4) { const [ko, ja] = n.say; JA ? bubble(n.x, n.y, ko, `${kata(ko)} ・ ${ja}`) : bubble(n.x, n.y, ja, ko); }
  if (typeof NET !== "undefined") NET.drawOver();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// 처음 들어오면 조작 안내 (한 번만)
(() => {
  let seen = false; try { seen = localStorage.getItem("kj-world-seen") === "1"; localStorage.setItem("kj-world-seen", "1"); } catch {}
  if (seen) return;
  showMsg(tr("🚉 한일역에 오신 걸 환영해요", "🚉 日韓駅へようこそ"),
    `<div class="keys">
      <span>🕹️</span><span>${tr("화면 아무 데나 누르고 끌면 걸어요 (PC는 방향키·WASD)", "画面を押したままドラッグで歩く（PCは矢印キー・WASD）")}</span>
      <span>🅰️</span><span>${tr("색깔 동그라미 위에서 A (PC는 스페이스)로 게임 시작", "色の丸の上でA（PCはスペース）でゲーム開始")}</span>
      <span>🇰🇷</span><span>${tr("1번선: 한국어 끝말잇기", "1番線：韓国語しりとり")}</span>
      <span>🇯🇵</span><span>${tr("2번선: 일본어 しりとり", "2番線：日本語しりとり")}</span>
      <span>🪧</span><span>${tr("광장: 뜻이 맞는 역명판으로 달리기", "広場：意味が合う駅名標へダッシュ")}</span>
      <span>🎮</span><span>${tr("대합실: 러너·단어 대결·내기·온라인 대결", "コンコース：ランナー・単語バトル・勝負・オンライン対戦")}</span>
    </div>`, [[tr("출발!", "出発！"), closeAll]]);
})();
</script>
