name: Firebase 배포

# main에 합쳐질 때마다 https://hanil-densha.web.app 에 자동 배포
# 비밀키 없이 Google 워크로드 아이덴티티(OIDC)로 로그인
on:
  push:
    branches: [main, claude/project-thread-8lygjx]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/839137693619/locations/global/workloadIdentityPools/github/providers/japanese-site
          service_account: github-deploy@hanil-app.iam.gserviceaccount.com
          create_credentials_file: true
      - run: npx -y firebase-tools@13 deploy --only hosting --project hanil-app --non-interactive
