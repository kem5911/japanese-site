<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일본어 학습</title>
<style>
  :root { --bg:#f6f5f1; --card:#fff; --text:#222; --muted:#777; --accent:#c8374a; --line:#e3e0d8; --done:#e8f3ea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1b1d; --card:#26262a; --text:#eee; --muted:#999; --accent:#ff6b7f; --line:#3a3a3f; --done:#22352a; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,"Noto Sans KR","Noto Sans JP",sans-serif; background:var(--bg); color:var(--text); }
  header { padding:20px 16px 0; max-width:820px; margin:auto; }
  h1 { margin:0 0 12px; font-size:1.5rem; }
  nav { display:flex; gap:4px; border-bottom:1px solid var(--line); overflow-x:auto; }
  nav button { white-space:nowrap; flex:none; }
  nav button { border:0; background:none; padding:10px 14px; font-size:1rem; color:var(--muted); cursor:pointer; border-bottom:3px solid transparent; }
  nav button[aria-selected="true"] { color:var(--accent); border-color:var(--accent); font-weight:600; }
  main { max-width:820px; margin:auto; padding:16px; }
  section[hidden] { display:none; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px; color:var(--muted); }
  .word { display:flex; gap:12px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:8px; }
  .word.done { background:var(--done); }
  .word input { width:20px; height:20px; margin-top:4px; flex:none; }
  .jp { font-size:1.3rem; font-weight:600; }
  .yomi { color:var(--muted); margin-left:6px; }
  .ex { color:var(--muted); margin-top:4px; }
  .flash { min-height:260px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; cursor:pointer; user-select:none; width:100%; font:inherit; color:inherit; }
  .flash .jp { font-size:2.6rem; }
  .flash .back { margin-top:16px; font-size:1.1rem; line-height:1.7; }
  .controls { display:flex; justify-content:center; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .controls button, .bar button { padding:8px 16px; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; cursor:pointer; font-size:1rem; }
  h2 { font-size:1.15rem; margin:24px 0 8px; }
  .phrase { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:6px; }
  .phrase .ko { color:var(--muted); font-size:.95rem; }
  .say { border:0; background:none; cursor:pointer; font-size:1rem; padding:2px 4px; vertical-align:middle; }
  .rate { display:flex; align-items:center; gap:8px; margin:0 0 10px; color:var(--muted); }
  .lis-now { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px 16px; text-align:center; min-height:190px; display:flex; flex-direction:column; justify-content:center; gap:10px; }
  .lis-now .jp { font-size:2rem; }
  .lis-now .ko { font-size:1.15rem; }
  .lis-step { color:var(--muted); font-size:.9rem; }
  .lis-big { font-size:1.2rem; padding:12px 28px !important; background:var(--accent) !important; color:#fff !important; border-color:var(--accent) !important; }
  .lis-opts { display:grid; gap:10px; margin:14px 0; color:var(--muted); }
  .lis-opts label { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .lis-opts select { font:inherit; padding:4px 6px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--text); }
  .lis-list { margin-top:16px; }
  .lis-list .phrase { cursor:pointer; }
  .lis-list .phrase.on { border-color:var(--accent); }
  .lis-credit { font-size:.8rem; color:var(--muted); margin-top:18px; line-height:1.6; }
  .lis-credit a { color:inherit; }
</style>
</head>
<body>
<header>
  <h1>🇯🇵 일본어 학습 (JLPT N3~N2)</h1>

  <nav role="tablist">

    <button role="tab" aria-selected="false" data-tab="flash">플래시카드</button>
    <button role="tab" aria-selected="false" data-tab="talk">실생활 회화</button>
    <button role="tab" aria-selected="false" data-tab="listen">🎧 듣기 모드</button>
  </nav>
</header>
<main>
  <section id="list">
    <div class="bar"><span id="count"></span><label><input type="checkbox" id="hideDone"> 외운 단어 숨기기</label></div>
    <div id="words"></div>
  </section>

  <section id="flash" hidden>

    <div class="flash" id="card" role="button" tabindex="0" aria-live="polite"></div>
    <div class="controls">
      <button id="prev">◀ 이전</button>
      <button id="mark"></button>
      <button id="next">다음 ▶</button>
      <button id="shuffle">🔀 섞기</button>
    </div>
  </section>

  <section id="talk" hidden></section>

  <section id="listen" hidden>
    <p class="lis-step" style="margin-top:0">일본 사람이 직접 녹음한 목소리예요 (기계 음성 아님). 재생하고 화면을 꺼도 계속 들려요.</p>
    <div class="lis-now" aria-live="polite">
      <div class="lis-step" id="lisStep">▶ 를 누르면 시작해요</div>
      <div class="jp" id="lisJp">本当？</div>
      <div class="ko" id="lisKo">정말이야?</div>
    </div>
    <div class="controls">
      <button id="lisPrev" aria-label="이전 문장">⏮</button>
      <button id="lisPlay" class="lis-big">▶ 재생</button>
      <button id="lisNext" aria-label="다음 문장">⏭</button>
    </div>
    <div class="lis-opts">
      <label>🔁 한 문장 반복 <select id="lisRep"><option value="1">1번</option><option value="2" selected>2번</option><option value="3">3번</option></select></label>
      <label>🗣 따라 말할 틈 <select id="lisGap"><option value="1">짧게 (1초)</option><option value="2.5" selected>보통 (2.5초)</option><option value="4">길게 (4초)</option></select></label>
      <label>🐢 속도 <select id="lisSpd"><option value="0.75">0.75x</option><option value="0.9">0.9x</option><option value="1" selected>1x</option></select></label>
      <label><input type="checkbox" id="lisShuf"> 🔀 순서 섞기</label>
      <label><input type="checkbox" id="lisHide"> 🙈 뜻 가리기 (들리는 대로 맞혀 보기)</label>
    </div>
    <div class="lis-list" id="lisList"></div>
    <div class="lis-credit">녹음: <a href="https://tatoeba.org" target="_blank" rel="noopener">Tatoeba</a> 기여자 yomi, lowteq, fal, CVjpn1, CVjpn29 · 문장 CC BY 2.0 FR · 녹음 라이선스는 기여자별로 다르며 각 문장의 Tatoeba 페이지에서 확인할 수 있어요. 한국어 뜻은 이 앱이 다듬었어요.</div>
  </section>
</main>

// 음성 읽기 (Web Speech API)
const say = t => `<button class="say" data-say="${t}" aria-label="읽기: ${t}">🔊</button>`;
$("rate").oninput = () => $("rateVal").textContent = (+$("rate").value).toFixed(1) + "x";
function speak(text) {
  if (!("speechSynthesis" in window)) return alert("이 브라우저는 음성 읽기를 지원하지 않아요.");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP";
  u.voice = speechSynthesis.getVoices().find(v => v.lang.replace("_", "-") === "ja-JP") || null;
  u.rate = +$("rate").value;
  speechSynthesis.speak(u);
}

document.addEventListener("click", e => {

  if (b) { e.preventDefault(); e.stopPropagation(); speak(b.dataset.say); }
}, true);

// 탭
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll("main section").forEach(s => s.hidden = s.id !== b.dataset.tab);
});

// 단어장
function renderList() {
  $("count").textContent = `외운 단어 ${done.size} / ${W.length}`;
  $("words").innerHTML = "";
  W.filter(w => !($("hideDone").checked && done.has(w[0]))).forEach(([jp, yomi, ko, ex]) => {
    const el = document.createElement("label");
    el.className = "word" + (done.has(jp) ? " done" : "");
    el.innerHTML = `<input type="checkbox" ${done.has(jp) ? "checked" : ""}>
      <div><span class="jp">${jp}</span>${say(jp)}<span class="yomi">${yomi}</span> — ${ko}<div class="ex">${ex}${say(ex)}</div></div>`;
    el.querySelector("input").onchange = () => toggle(jp);
    $("words").append(el);
  });
}
$("hideDone").onchange = renderList;

// 플래시카드
let order = W.map((_, i) => i), i = 0, flipped = false;
const deck = () => order.filter(n => !($("skipDone").checked && done.has(W[n][0])));
function renderCard() {
  const d = deck();
  if (!d.length) { $("card").innerHTML = "🎉 모든 단어를 외웠어요!"; $("pos").textContent = "0 / 0"; $("mark").hidden = true; return; }
  i = (i + d.length) % d.length;
  const [jp, yomi, ko, ex] = W[d[i]];
  $("pos").textContent = `${i + 1} / ${d.length}`;
  $("card").innerHTML = `<div class="jp">${jp}${say(jp)}</div>` + (flipped
    ? `<div class="back"><b>${yomi}</b><br>${ko}<br><span class="ex">${ex}</span>${say(ex)}</div>`
    : `<div class="ex" style="margin-top:16px">눌러서 뜻 보기</div>`);
  $("mark").hidden = false;
  $("mark").textContent = done.has(jp) ? "✅ 외움 (취소)" : "☐ 외웠어요";
}
const go = step => { i += step; flipped = false; renderCard(); };
$("card").onclick = () => { flipped = !flipped; renderCard(); };
$("card").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("card").click(); } };
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("mark").onclick = () => { const d = deck(); toggle(W[d[i]][0]); };
$("shuffle").onclick = () => { order.sort(() => Math.random() - 0.5); i = 0; flipped = false; renderCard(); };
$("skipDone").onchange = () => { i = 0; flipped = false; renderCard(); };

// 회화
$("talk").innerHTML = Object.entries(T).map(([title, list]) =>
  `<h2>${title}</h2>` + list.map(([jp, ko]) => `<div class="phrase"><div>${jp}${say(jp)}</div><div class="ko">${ko}</div></div>`).join("")
).join("");

// ── 듣기 모드 ──
// 하나의 <audio> 요소로 "원어민 녹음 → 무음(따라 말할 틈) → 반복"을 이어서 틀어
// 화면이 꺼져도 브라우저가 재생을 이어가게 함. 틈도 setTimeout 대신 무음 오디오로 채움.
const lis = { el: new Audio(), order: L.map((_, n) => n), pos: 0, rep: 0, phase: "idle", playing: false };
lis.el.preload = "auto";
const silence = (() => { const cache = {}; return sec => {
  if (cache[sec]) return cache[sec];
  const rate = 8000, n = Math.round(rate * sec), buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, str) => [...str].forEach((c, k) => v.setUint8(o + k, c.charCodeAt(0)));
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVEfmt "); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
  return cache[sec] = URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
}; })();
const lisCur = () => L[lis.order[lis.pos]];
function lisShow() {
  const [id, , jp, ko] = lisCur(), hide = $("lisHide").checked;
  $("lisJp").textContent = jp;
  $("lisKo").textContent = hide && lis.phase !== "reveal" ? "（뜻은 마지막에 보여요）" : ko;
  const reps = +$("lisRep").value;
  $("lisStep").textContent = !lis.playing ? `⏸ ${lis.pos + 1} / ${L.length}`
    : lis.phase === "gap" ? "🗣 따라 말해 보세요" : lis.phase === "reveal" ? "💡 뜻 확인" : `🎧 듣는 중 ${Math.min(lis.rep + 1, reps)}/${reps} · ${lis.pos + 1} / ${L.length}`;
  $("lisPlay").textContent = lis.playing ? "⏸ 일시정지" : "▶ 재생";
  document.querySelectorAll("#lisList .phrase").forEach(p => p.classList.toggle("on", +p.dataset.id === id));
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: jp, artist: hide && lis.phase !== "reveal" ? "듣기 모드" : ko, album: "🎧 일본어 듣기 모드" });
    navigator.mediaSession.playbackState = lis.playing ? "playing" : "paused";
  }
}
function lisLoad(src, isVoice) {
  lis.el.src = src;
  lis.el.playbackRate = isVoice ? +$("lisSpd").value : 1;
  lis.el.play().catch(() => { lis.playing = false; lisShow(); });
}
function lisStep() {
  if (!lis.playing) return;
  const reps = +$("lisRep").value, gap = +$("lisGap").value;
  if (lis.phase === "voice") { lis.phase = "gap"; lis.rep++; lisLoad(silence(gap), false); }
  else if (lis.phase === "gap" && lis.rep < reps) { lis.phase = "voice"; lisLoad(LIS_AUDIO(lisCur()[0]), true); }
  else if (lis.phase === "gap") { lis.phase = "reveal"; lisLoad(silence(1), false); }
  else { lis.pos = (lis.pos + 1) % L.length; lisStart(); return; }
  lisShow();
}
function lisStart() { lis.rep = 0; lis.phase = "voice"; lisLoad(LIS_AUDIO(lisCur()[0]), true); lisShow(); }
lis.el.onended = lisStep;
lis.el.onerror = () => { if (lis.playing && lis.phase === "voice") { lis.phase = "reveal"; lisStep(); } };
function lisToggle(on = !lis.playing) {
  lis.playing = on;
  if (on) { lis.phase === "idle" || lis.el.ended || !lis.el.src ? lisStart() : lis.el.play().catch(() => {}); }
  else lis.el.pause();
  lisShow();
}
const lisJump = d => { lis.pos = (lis.pos + d + L.length) % L.length; if (lis.playing) lisStart(); else { lis.phase = "idle"; lisShow(); } };
$("lisPlay").onclick = () => lisToggle();
$("lisPrev").onclick = () => lisJump(-1);
$("lisNext").onclick = () => lisJump(1);
$("lisHide").onchange = lisShow;
$("lisShuf").onchange = () => {
  const cur = lis.order[lis.pos];
  lis.order = L.map((_, n) => n);
  if ($("lisShuf").checked) lis.order.sort(() => Math.random() - 0.5);
  lis.pos = lis.order.indexOf(cur); lisShow();
};
$("lisList").innerHTML = L.map(([id, , jp, ko]) => `<div class="phrase" data-id="${id}"><div>${jp}</div><div class="ko">${ko}</div></div>`).join("");
$("lisList").onclick = e => {
  const p = e.target.closest(".phrase"); if (!p) return;
  lis.pos = lis.order.indexOf(L.findIndex(x => x[0] === +p.dataset.id));
  lis.playing = true; lisStart();
};
if ("mediaSession" in navigator) {
  const ms = navigator.mediaSession;
  ms.setActionHandler("play", () => lisToggle(true));
  ms.setActionHandler("pause", () => lisToggle(false));
  ms.setActionHandler("previoustrack", () => lisJump(-1));
  ms.setActionHandler("nexttrack", () => lisJump(1));
}
lisShow();

renderList();
renderCard();
</script>
</body>
</html>
